<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>cover-photo-feed</title>
<!--
  照片封面模板（2.35:1，B 类个人叙事首选）
  改这几处：
   1) background-image 的 url → ../images/<你的照片>.jpg
   2) background-position 的百分比 → 调到主体（人/猫/物）落在照片区可见处
   3) kicker / 主标题 / 副标 / 三个标签
   4) credit（右下角小字，可删）
  主标题 4-6 字，关键词套 <em> 变橙。规范见 references/photo-handling.md。
  渲染：bash scripts/render_cover.sh <ART>/diagrams/cover-photo-feed.html
-->
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body {
    width:900px; height:383px; overflow:hidden;
    font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
    background:#0A1322;
  }
  .canvas { position:relative; width:900px; height:383px; display:flex; align-items:stretch; }
  .left {
    flex:0 0 500px; display:flex; flex-direction:column; justify-content:center;
    padding:0 0 0 52px; position:relative; z-index:2;
    background:linear-gradient(135deg,#0A1322 0%,#101E33 60%,#16273D 100%);
  }
  .glow {
    position:absolute; left:320px; top:-160px; width:480px; height:480px;
    background:radial-gradient(circle, rgba(255,138,61,0.16) 0%, rgba(255,138,61,0) 70%);
    pointer-events:none;
  }
  .kicker { font-size:19px; color:#8FA0B5; letter-spacing:0.30em; margin-bottom:14px; }
  .title { font-size:72px; font-weight:800; line-height:1.10; color:#FFFFFF; letter-spacing:0.04em; }
  .title em { font-style:normal; color:#FF8A3D; }
  .desc { margin-top:14px; font-size:22px; color:#C9D3DF; line-height:1.5; letter-spacing:0.03em; }
  .desc b { color:#FFFFFF; font-weight:700; }
  .underline { margin-top:12px; width:112px; height:5px; border-radius:4px;
    background:linear-gradient(90deg,#FF8A3D,#FFC24B); }
  .tags { display:flex; gap:9px; margin-top:16px; }
  .tag { font-size:15px; color:#CBD5E1; padding:4px 11px;
    border:1px solid rgba(203,213,225,0.28); border-radius:999px;
    background:rgba(255,255,255,0.04); white-space:nowrap; }
  .photo {
    flex:1; position:relative;
    background-image:url('../images/{{PHOTO_FILE}}');
    background-size:cover; background-position:center 66%;
  }
  .photo::before {
    content:''; position:absolute; inset:0;
    background:linear-gradient(90deg, #101E33 0%, rgba(16,30,51,0.55) 14%, rgba(16,30,51,0) 42%);
  }
  .photo::after {
    content:''; position:absolute; left:0; right:0; bottom:0; height:90px;
    background:linear-gradient(0deg, rgba(8,13,22,0.72) 0%, rgba(8,13,22,0) 100%);
  }
  .credit {
    position:absolute; right:14px; bottom:10px; z-index:3;
    font-size:12px; color:rgba(255,255,255,0.62); letter-spacing:0.14em;
  }
</style>
</head>
<body>
<div class="canvas">
  <div class="left">
    <div class="glow"></div>
    <div class="kicker">{{场景 · 时间}}</div>
    <div class="title">{{四六}}<em>{{字主标题}}</em></div>
    <div class="desc">{{副标第一行，}}<br><b>{{第二行加粗}}</b></div>
    <div class="underline"></div>
    <div class="tags">
      <span class="tag">{{具体细节一}}</span>
      <span class="tag">{{具体细节二}}</span>
      <span class="tag">{{具体细节三}}</span>
    </div>
  </div>
  <div class="photo"><div class="credit">{{照片里是什么}}</div></div>
</div>
</body>
</html>
