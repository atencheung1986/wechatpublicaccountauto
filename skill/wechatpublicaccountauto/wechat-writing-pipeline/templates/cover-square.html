<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>cover-square-v2</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body {
    width:400px; height:400px; overflow:hidden;
    font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
    background:#0A1322;
  }
  .canvas {
    position:relative; width:400px; height:400px;
    background:linear-gradient(150deg,#0A1322 0%,#101E33 50%,#1B2C45 100%);
    display:flex; flex-direction:column; justify-content:center; align-items:center;
    padding:0 26px;
  }
  .glow {
    position:absolute; right:-70px; top:-80px; width:340px; height:340px;
    background:radial-gradient(circle, rgba(255,138,61,0.32) 0%, rgba(255,138,61,0) 70%);
    pointer-events:none;
  }
  .glow2 {
    position:absolute; left:-90px; bottom:-120px; width:320px; height:320px;
    background:radial-gradient(circle, rgba(47,111,237,0.22) 0%, rgba(47,111,237,0) 72%);
    pointer-events:none;
  }
  .kicker {
    font-size:14px; color:#8FA0B5; letter-spacing:0.30em; margin-bottom:14px;
    position:relative; z-index:2;
  }
  .title {
    font-size:48px; font-weight:800; line-height:1.15; color:#FFFFFF;
    letter-spacing:0.04em; text-align:center; position:relative; z-index:2;
  }
  .title em { font-style:normal; color:#FF8A3D; }
  .lead {
    margin-top:8px; font-size:13px; color:#FFC24B; letter-spacing:0.18em;
    position:relative; z-index:2;
  }
  .big {
    margin-top:4px; font-size:110px; font-weight:800; color:#FFFFFF; line-height:1.0;
    letter-spacing:0.02em; position:relative; z-index:2;
    text-shadow:0 0 40px rgba(255,138,61,0.35);
  }
  .desc {
    margin-top:6px; font-size:17px; color:#C9D3DF; letter-spacing:0.06em;
    position:relative; z-index:2;
  }
  .underline {
    margin:14px auto 0; width:92px; height:5px; border-radius:4px;
    background:linear-gradient(90deg,#FF8A3D,#FFC24B); position:relative; z-index:2;
  }
  .tags {
    display:flex; gap:7px; margin-top:18px; justify-content:center;
    position:relative; z-index:2;
  }
  .tag {
    font-size:12px; color:#CBD5E1; padding:4px 10px;
    border:1px solid rgba(203,213,225,0.28); border-radius:999px;
    background:rgba(255,255,255,0.04); white-space:nowrap;
  }
</style>
</head>
<body>
<!-- 改这六处：kicker / 主标题(关键词套 em) / 副标 / 三个标签 / 巨大单字 / 英文小注。规范见 references/cover-style.md -->
<div class="canvas">
  <div class="glow"></div>
  <div class="glow2"></div>
  <div class="kicker">正经项目经理的</div>
  <div class="title"><em>AI</em> 使用之道</div>
  <div class="lead">一个字</div>
  <div class="big">找</div>
  <div class="desc">不让它替你写，让它替你找</div>
  <div class="underline"></div>
  <div class="tags">
    <span class="tag">会议 → 台账</span>
    <span class="tag">变更 → 影响面</span>
    <span class="tag">周报 → 风险信号</span>
  </div>
</div>
</body>
</html>
